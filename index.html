<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VoiceHub</title>
<style>
:root{--bg:#12161d;--panel:#1b212b;--line:#2b3441;--text:#e8ecf2;--dim:#8d99ab;--accent:#5b8def;--bad:#e5484d;--ok:#3fb68b;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.4 "Segoe UI",system-ui,sans-serif}
button,input{font:inherit;color:inherit}
.hidden{display:none!important}
#join{min-height:100%;display:grid;place-items:center;padding:24px}
#join form{width:min(380px,100%);display:grid;gap:12px}
#join h1{margin:0 0 4px;font-size:28px;letter-spacing:-.02em}
#join p{margin:0 0 8px;color:var(--dim)}
input{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:11px 12px;width:100%}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);border:0;border-radius:8px;padding:12px;font-weight:600;cursor:pointer;color:#fff}
.primary:disabled{opacity:.5;cursor:not-allowed}
#err{color:var(--bad);min-height:1.4em;margin:0}
.chk{display:flex;gap:8px;align-items:center;color:var(--text)}
.chk input{width:auto}
.hint{font-size:13px;color:var(--dim);margin:0}
#app{height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line)}
header b{font-size:16px}
#count{color:var(--dim)}
#banner{margin-left:auto;background:var(--accent);color:#fff;border-radius:6px;padding:3px 10px;font-size:13px}
#grid{flex:1;min-height:0;display:grid;gap:10px;padding:12px;overflow:auto;align-content:start;
  grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));
  grid-auto-rows:minmax(140px,auto)}
.tile{position:relative;aspect-ratio:16/10;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:grid;place-items:center}
.tile.speaking{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok)}
.tile video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile .av{width:25%;aspect-ratio:1;max-width:72px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:26px;font-weight:600}
.tile.cam .av{display:none}
.tile:not(.cam) video{opacity:0}
.label{position:absolute;left:8px;bottom:8px;display:flex;gap:6px;align-items:center;background:#000a;border-radius:6px;padding:3px 8px;font-size:13px}
.tag{background:var(--accent);border-radius:4px;padding:0 5px;font-size:11px}
.muted-ic{color:var(--bad)}
.adm{position:absolute;right:6px;top:6px;display:flex;gap:4px}
.adm button{background:#000a;border:0;border-radius:6px;padding:4px 8px;font-size:12px;cursor:pointer}
.adm button:hover{background:var(--bad)}
.soundbtn{position:absolute;left:8px;bottom:40px;z-index:2;background:var(--accent);color:#fff;border:0;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:13px}
#recmeter{color:var(--dim);font:12px ui-monospace,Menlo,monospace}
#recbanner{background:var(--bad);color:#fff;border-radius:6px;padding:3px 10px;font-size:13px}
#musicbar{display:flex;gap:14px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
#ytbox{position:relative;width:320px;height:180px;background:#000;border-radius:8px;overflow:hidden;flex:none;pointer-events:none}
#ytbox::after{content:"";position:absolute;inset:0;pointer-events:auto}
#mresume{justify-self:start;background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
.mctl{display:grid;gap:8px;flex:1;min-width:240px}
#madmin{display:flex;gap:6px;flex-wrap:wrap}
#madmin input{flex:1;min-width:180px}
#madmin button{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
.mctl label{display:flex;gap:10px;align-items:center;color:var(--dim)}
.mctl input[type=range]{width:160px;padding:0}
#devpanel{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);z-index:5;width:min(92vw,360px);max-height:60vh;overflow:auto;display:grid;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:0 8px 30px #0008}
#devpanel label{display:grid;gap:4px;color:var(--dim);font-size:13px}
#devpanel select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px;color:var(--text);width:100%}
footer{display:flex;justify-content:center;gap:10px;padding:12px;border-top:1px solid var(--line);flex-wrap:wrap}
footer button{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:10px 18px;cursor:pointer}
footer button:hover{border-color:var(--dim)}
footer button.off{background:var(--bad);border-color:var(--bad)}
footer button.on{background:var(--accent);border-color:var(--accent)}
footer button:disabled{opacity:.4;cursor:not-allowed}
#leave{background:var(--bad);border-color:var(--bad)}
</style>
</head>
<body>
<section id="join">
  <form id="f">
    <div><h1>VoiceHub</h1><p>Голосовые комнаты до 20 человек.</p></div>
    <input id="name" placeholder="Ваше имя" required maxlength="30">
    <input id="room" placeholder="Название комнаты" value="main" required maxlength="40">
    <label class="chk"><input id="admin" type="checkbox"> Я администратор — создать комнату</label>
    <p class="hint">Админ заходит первым и создаёт комнату. Участники заходят по тому же названию, пока админ в сети.</p>
    <p id="err"></p>
    <button class="primary">Войти в комнату</button>
  </form>
</section>

<section id="app" class="hidden">
  <header><b id="rn"></b><span id="count"></span><span id="banner" class="hidden">Говорит администратор</span><span id="recbanner" class="hidden">● Идёт запись</span><span id="recmeter" class="hidden"></span></header>
  <div id="musicbar" class="hidden">
    <div id="ytbox"><div id="yt"></div></div>
    <div class="mctl">
      <div id="mnow">Музыка не выбрана</div>
      <button id="mresume" class="hidden">▶ Включить музыку</button>
      <div id="madmin" class="hidden">
        <input id="mlink" placeholder="Ссылка на видео YouTube">
        <button id="mplay">Включить</button><button id="mpause">Пауза</button><button id="mstop">Стоп</button>
      </div>
      <label>Громкость музыки <input id="mvol" type="range" min="0" max="100" value="60"></label>
    </div>
  </div>
  <main id="grid"></main>
  <div id="devpanel" class="hidden">
    <label>Микрофон<select id="micsel"></select></label>
    <label>Камера<select id="camsel"></select></label>
  </div>
  <footer>
    <button id="mic">Микрофон</button>
    <button id="cam">Камера</button>
    <button id="flip" class="hidden">Сменить камеру</button>
    <button id="bc" class="hidden">Эфир администратора</button>
    <button id="muteall" class="hidden">Выключить всем микрофон</button>
    <button id="dev">Устройства</button>
    <button id="rec" class="hidden">Запись</button>
    <button id="leave">Выйти</button>
  </footer>
</section>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
// Данные из личного кабинета Metered (TURN Server -> Credentials). Вставьте свои — старые уже засвечены в переписке.
const TURN_HOST = 'standard.relay.metered.ca', TURN_USER = 'ВАШ_ЛОГИН', TURN_PASS = 'ВАШ_ПАРОЛЬ';
const TURN = [
  { urls: 'stun:stun.relay.metered.ca:80' },
  { urls: 'turn:' + TURN_HOST + ':80', username: TURN_USER, credential: TURN_PASS },
  { urls: 'turn:' + TURN_HOST + ':80?transport=tcp', username: TURN_USER, credential: TURN_PASS },
  { urls: 'turn:' + TURN_HOST + ':443', username: TURN_USER, credential: TURN_PASS },
  { urls: 'turns:' + TURN_HOST + ':443?transport=tcp', username: TURN_USER, credential: TURN_PASS }
];
let ICE = TURN;

// --- таймер в воркере: не тормозится в фоновой вкладке (нужен для пульса, сторожа, индикатора голоса и кадров записи) ---
function startTicker(fn, ms) {
  const w = new Worker(URL.createObjectURL(new Blob([`setInterval(() => postMessage(0), ${ms})`])));
  w.onmessage = fn; return w;
}

let myId, myName = '', isAdmin = false, broadcast = false, leaving = false, joining = false;
let micTrack = null, camTrack = null, micOn = true, camOn = false;
let localStream = new MediaStream();           // общий стрим «себя»: сюда добавляются mic/cam треки, видео-тег слушает его один раз
const MAX_CAMS = 6;                             // больше одновременных камер — видео начнёт тормозить у всех в mesh
const peers = new Map();  // id -> {pc, vt, at, stream, q}
const info = new Map();   // id -> данные участника (включая себя)
const tiles = new Map();  // id -> DOM-рефы плитки (персистентные, не пересоздаются на каждый render)
const pendingSignals = new Map(); // id -> сигналы, пришедшие до того как для этого id создан peer (гонка peer-joined/signal)
const analysers = new Map(); // id -> {analyser, buf} для индикатора «говорит»
let monitorCtx = null;          // через него же идёт звук собеседников — на iPhone это чинит баг с "трубкой" вместо динамика
let currentFacing = 'user';

// Не даём экрану админа гаснуть, пока он держит комнату открытой — иначе браузер-«хаб» замирает и комната рушится у всех.
let wakeLock = null;
async function keepAwake() {
  try { wakeLock = await navigator.wakeLock.request('screen'); } catch {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (isAdmin) keepAwake();
  if (monitorCtx && monitorCtx.state === 'suspended') monitorCtx.resume().catch(() => {});
  if (myId) send({ type: 'ping' });                 // сразу подтверждаем присутствие после возврата из фона/разблокировки
  peers.forEach(p => {
    const st = p.pc.iceConnectionState;
    if (st === 'failed' || st === 'disconnected') p.pc.restartIce();
  });
});

// --- Связь без своего сервера: бесплатный облачный сигналинг PeerJS. Админ = «хаб» комнаты прямо в его браузере ---
const MAX = 20;
let peer = null;
const hub = { clients: new Map(), broadcast: false, music: null, recording: false, next: 1 };
const net = { send: () => {}, close: () => {} };
const send = m => net.send(m);
const setErr = t => { $('#err').textContent = t; joining = false; const b = $('#f button'); if (b) b.disabled = false; };
async function roomPeerId(room) {
  const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('voicehub:' + room.toLowerCase()));
  return 'vh-' + [...new Uint8Array(d)].slice(0, 12).map(x => x.toString(16).padStart(2, '0')).join('');
}
$('#f').onsubmit = async e => {
  e.preventDefault();
  if (joining) return;
  joining = true; setErr('');
  const btn = e.target.querySelector('button'); if (btn) btn.disabled = true;
  if (!window.Peer) return setErr('Не загрузилась библиотека PeerJS: проверьте интернет.');
  const name = $('#name').value.trim(), room = $('#room').value.trim();
  if (!name) return setErr('Введите имя.');
  myName = name;
  // AudioContext создаём сразу по клику (пользовательский жест) — иначе iOS может позже заблокировать звук.
  try {
    monitorCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (monitorCtx.state === 'suspended') await monitorCtx.resume();
  } catch { monitorCtx = null; }
  try {
    const s = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
    micTrack = s.getAudioTracks()[0];
    micTrack.onended = () => { micOn = false; micTrack = null; updateButtons(); if (myId) pushState(); };
    localStream.addTrack(micTrack);
  } catch { micTrack = null; micOn = false; }
  const hostId = await roomPeerId(room);
  $('#admin').checked ? startHost(hostId, name) : startGuest(hostId, name);
};

// Хаб: то же, что делал сервер (участники, пересылка сигналов, команды админа), только внутри браузера админа.
const pub = c => ({ id: c.id, name: c.name, admin: c.admin, mic: c.mic, cam: c.cam });
const hubSend = (c, m) => c.local ? queueMicrotask(() => onMsg(m)) : (c.conn.open && c.conn.send(m));
const hubAll = m => hub.clients.forEach(c => hubSend(c, m));
const musicNow = () => hub.music && { videoId: hub.music.videoId, playing: hub.music.playing,
  time: hub.music.time + (hub.music.playing ? (Date.now() - hub.music.at) / 1000 : 0) };
function hubJoin(c) {
  c.lastSeen = Date.now();
  hubSend(c, { type: 'welcome', id: c.id, admin: c.admin, broadcast: hub.broadcast, recording: hub.recording,
    music: musicNow(), peers: [...hub.clients.values()].map(pub) });
  hub.clients.forEach(o => hubSend(o, { type: 'peer-joined', peer: pub(c) }));
  hub.clients.set(c.id, c);
}
function hubLeave(c) {
  if (!hub.clients.delete(c.id)) return;
  hubAll({ type: 'peer-left', id: c.id });
}
function hubHandle(c, m) {
  c.lastSeen = Date.now();                              // любое сообщение (включая ping) продлевает «жизнь» клиента
  if (m.type === 'signal') { const t = hub.clients.get(m.to); t && hubSend(t, { type: 'signal', from: c.id, data: m.data }); }
  else if (m.type === 'state') {
    c.mic = !!m.mic; c.cam = !!m.cam;
    hub.clients.forEach(o => o !== c && hubSend(o, { type: 'state', id: c.id, mic: c.mic, cam: c.cam }));
  } else if (c.admin) {
    if (m.type === 'broadcast') { hub.broadcast = !!m.on; hubAll({ type: 'broadcast', on: hub.broadcast }); }
    else if (m.type === 'music') {
      const id = m.videoId && String(m.videoId).slice(0, 20);
      hub.music = id ? { videoId: id, playing: !!m.playing, time: +m.time || 0, at: Date.now() } : null;
      hubAll({ type: 'music', music: musicNow() });
    } else if (m.type === 'music-sync') {
      if (hub.music && hub.music.playing && hub.music.videoId === m.videoId) {
        hub.music.time = +m.time || 0; hub.music.at = Date.now();
        hub.clients.forEach(o => o !== c && hubSend(o, { type: 'music-sync', videoId: m.videoId, time: hub.music.time }));
      }
    } else if (m.type === 'recording') { hub.recording = !!m.on; hubAll({ type: 'recording', on: hub.recording }); }
    else if (m.type === 'mute-all') hub.clients.forEach(o => o !== c && hubSend(o, { type: 'force-mute' }));
    else if (m.type === 'mute' || m.type === 'kick') {
      const t = hub.clients.get(m.to);
      if (t) { hubSend(t, { type: m.type === 'mute' ? 'force-mute' : 'kicked' }); if (m.type === 'kick' && t.conn) setTimeout(() => t.conn.close(), 300); }
    }
  }
}
function startHost(hostId, name) {
  let started = false;
  const startedAt = Date.now();
  function createPeer() {
    peer = new Peer(hostId, { config: { iceServers: TURN } });
    peer.on('error', err => {
      if (myId) { console.warn(err); return; }           // уже в комнате — одиночная ошибка WebRTC не должна рушить хаб
      if (err.type === 'unavailable-id') {
        if (Date.now() - startedAt < 45000) {
          try { peer.destroy(); } catch {}
          setTimeout(createPeer, 3000);
        } else {
          setErr('Комната с таким названием уже создана. Выберите другое название или войдите как участник.');
        }
      } else {
        setErr('Ошибка сети: ' + err.type);
        try { peer.destroy(); } catch {}
      }
    });
    peer.on('disconnected', () => { if (!leaving) peer.reconnect(); });
    peer.on('open', () => {
      if (started) return; started = true;
      keepAwake();
      const me = { id: String(hub.next++), name, admin: true, mic: micOn, cam: false, local: true };
      net.send = m => hubHandle(me, m);
      net.close = () => { try { peer.destroy(); } catch {} };
      peer.on('connection', conn => {
        let c = null;
        conn.on('data', m => {
          if (!c && m.type === 'join') {
            if (hub.clients.size >= MAX) { conn.send({ type: 'error', text: `Комната заполнена (максимум ${MAX}).` }); setTimeout(() => conn.close(), 300); return; }
            c = { id: String(hub.next++), name: String(m.name || 'Гость').slice(0, 30).trim() || 'Гость', admin: false, mic: true, cam: false, conn };
            hubJoin(c);
          } else if (c) hubHandle(c, m);
        });
        conn.on('close', () => c && hubLeave(c));
      });
      hubJoin(me);
      // сторож: убираем тех, кто молчит дольше 18 сек (призраки) — работает через воркер, не тормозится в фоне
      startTicker(() => {
        const now = Date.now();
        hub.clients.forEach(c => {
          if (!c.local && now - (c.lastSeen || now) > 18000) {
            try { c.conn.close(); } catch {}
            hubLeave(c);
          }
        });
      }, 6000);
    });
  }
  createPeer();
}
function startGuest(hostId, name) {
  peer = new Peer(undefined, { config: { iceServers: TURN } });
  let opened = false, reconnecting = false;
  let tm = setTimeout(() => { if (!opened) fail('Не удалось подключиться к комнате. Проверьте название и интернет.'); }, 15000);
  const fail = t => { clearTimeout(tm); setErr(t); try { peer.destroy(); } catch {} };
  peer.on('error', err => {
    if (myId) { console.warn(err); return; }
    fail(err.type === 'peer-unavailable' ? 'Админ ещё не создал эту комнату. Пусть он войдёт первым.' : 'Ошибка сети: ' + err.type);
  });
  peer.on('disconnected', () => { if (!leaving) peer.reconnect(); });
  function bindConn(conn) {
    net.send = m => conn.open && conn.send(m);
    net.close = () => { try { conn.close(); } catch {} try { peer.destroy(); } catch {} };
    conn.on('open', () => {
      opened = true; clearTimeout(tm); reconnecting = false;
      conn.send({ type: 'join', name });
    });
    conn.on('data', m => onMsg(m));
    conn.on('close', () => { if (myId && !leaving) reconnectGuest(); });
    conn.on('error', () => { if (myId && !leaving) reconnectGuest(); });  // на мобильной сети 'close' не всегда приходит вовреме
  }
  function reconnectGuest() {
    if (reconnecting) return;
    reconnecting = true;
    let tries = 0;
    const attempt = () => {
      if (leaving) { reconnecting = false; return; }
      tries++;
      const conn = peer.connect(hostId, { reliable: true, serialization: 'json' });
      let done = false;
      conn.on('open', () => { done = true; bindConn(conn); });
      setTimeout(() => {
        if (done) return;
        if (tries >= 5) { reconnecting = false; leave('Админ закрыл комнату или пропала связь.'); }
        else attempt();
      }, 2000);
    };
    attempt();
  }
  peer.on('open', () => {
    const conn = peer.connect(hostId, { reliable: true, serialization: 'json' });
    bindConn(conn);
  });
}

async function onMsg(m) {
  switch (m.type) {
    case 'error': setErr(m.text); net.close(); break;
    case 'welcome':
      peers.forEach(p => p.pc.close()); peers.clear();
      info.clear(); pendingSignals.clear();
      analysers.forEach(a => { try { a.analyser.disconnect(); } catch {} }); analysers.clear();
      myId = m.id; isAdmin = m.admin; broadcast = m.broadcast;
      info.set(myId, { id: myId, name: myName, admin: isAdmin, mic: micOn, cam: false });
      $('#join').classList.add('hidden'); $('#app').classList.remove('hidden');
      $('#rn').textContent = $('#room').value;
      $('#bc').classList.toggle('hidden', !isAdmin); $('#muteall').classList.toggle('hidden', !isAdmin);
      $('#rec').classList.toggle('hidden', !isAdmin); $('#madmin').classList.toggle('hidden', !isAdmin);
      m.peers.forEach(p => { info.set(p.id, p); connect(p, true); });
      if (micTrack) attachAnalyser(myId, localStream);
      applyBroadcast(); applyMusic(m.music); setRec(m.recording); render();
      pushState();
      break;
    case 'peer-joined': info.set(m.peer.id, m.peer); connect(m.peer, false); render(); break;
    case 'peer-left':
      recSrc.get(m.id)?.disconnect(); recSrc.delete(m.id);
      analysers.get(m.id)?.analyser.disconnect(); analysers.delete(m.id);
      peers.get(m.id)?.pc.close(); peers.delete(m.id); info.delete(m.id); render(); break;
    case 'state': Object.assign(info.get(m.id) || {}, { mic: m.mic, cam: m.cam }); render(); break;
    case 'signal': onSignal(m.from, m.data); break;
    case 'music': applyMusic(m.music); break;
    case 'music-sync': syncMusic(m); break;
    case 'recording': setRec(m.on); break;
    case 'broadcast': broadcast = m.on; applyBroadcast(); break;
    case 'force-mute': setMic(false); break;
    case 'kicked': leave('Администратор исключил вас из комнаты.'); break;
  }
}

// --- WebRTC (mesh): новый участник звонит всем, кто уже в комнате ---
function connect(p, initiator) {
  const pc = new RTCPeerConnection({ iceServers: ICE });
  const stream = new MediaStream();
  const st = { pc, vt: null, at: null, stream, q: Promise.resolve() };
  pc.oniceconnectionstatechange = () => {
    const s = pc.iceConnectionState;
    if (s === 'failed') pc.restartIce();

$('#rec').onclick = async () => {
  if (!rec) {
    if (isMobile && !confirm('На телефоне запись не захватывает фоновую музыку с YouTube — будут только голоса участников. Продолжить?')) return;
    const ext = await startRec(); if (ext) send({ type: 'recording', on: true, ext });
  } else { await stopRec(); send({ type: 'recording', on: false }); }
};

// --- интерфейс: персистентные плитки, обновляем только то, что изменилось (без мигания видео/звука) ---
const firstChar = s => [...(s || '?')][0].toUpperCase();
function tryPlay(t) {
  t.video.play().catch(() => {
    if (t.soundBtn) return;
    const b = document.createElement('button');
    b.className = 'soundbtn'; b.textContent = '▶ Включить звук';
    b.onclick = () => { t.video.play(); b.remove(); t.soundBtn = null; };
    t.el.append(b); t.soundBtn = b;
  });
}
function createTile(p) {
  const el = document.createElement('div'); el.className = 'tile'; el.dataset.id = p.id;
  const video = document.createElement('video'); video.autoplay = true; video.playsInline = true; video.muted = true;
  // звук собеседников всегда идёт через AudioContext (attachAnalyser), видео-тег только для картинки с камеры
  const av = document.createElement('div'); av.className = 'av';
  const label = document.createElement('div'); label.className = 'label';
  const tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = 'админ';
  const nameEl = document.createElement('span');
  const micEl = document.createElement('span');
  label.append(tag, nameEl, micEl);
  el.append(video, av, label);
  if (isAdmin && p.id !== myId) {
    const adm = document.createElement('div'); adm.className = 'adm';
    const mb = document.createElement('button'); mb.textContent = 'Заглушить'; mb.onclick = () => send({ type: 'mute', to: p.id });
    const kb = document.createElement('button'); kb.textContent = 'Исключить'; kb.onclick = () => send({ type: 'kick', to: p.id });
    adm.append(mb, kb); el.append(adm);
  }
  $('#grid').append(el);
  const t = { el, video, av, tag, nameEl, micEl };
  tiles.set(p.id, t);
  return t;
}
function updateTile(p) {
  let t = tiles.get(p.id);
  if (!t) t = createTile(p);
  const me = p.id === myId;
  t.el.classList.toggle('cam', !!p.cam);
  t.tag.style.display = p.admin ? '' : 'none';
  t.nameEl.textContent = p.name + (me ? ' (вы)' : '');
  t.micEl.textContent = p.mic ? '🎙' : '🔇';
  t.micEl.className = p.mic ? '' : 'muted-ic';
  t.av.textContent = firstChar(p.name);
  if (!t.videoBound) {
    t.video.srcObject = me ? localStream : (peers.get(p.id)?.stream || null);
    if (t.video.srcObject) { tryPlay(t); t.videoBound = true; }
  } else if (!me && !t.video.srcObject) {
    const peer = peers.get(p.id);
    if (peer) { t.video.srcObject = peer.stream; tryPlay(t); }
  }
}
function render() {
  $('#count').textContent = `${info.size} / 20`;
  const ids = new Set(info.keys());
  tiles.forEach((t, id) => { if (!ids.has(id)) { t.el.remove(); tiles.delete(id); } });
  info.forEach(p => updateTile(p));
}
</script>
</body>
