<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Проверка TURN</title>
<style>body{font:16px/1.5 system-ui,sans-serif;background:#12161d;color:#e8ecf2;padding:20px;max-width:560px;margin:auto}
button{background:#5b8def;color:#fff;border:0;border-radius:8px;padding:12px 18px;font:inherit}
.r{padding:8px 0;border-bottom:1px solid #2b3441;word-break:break-all}.ok{color:#3fb68b}.no{color:#e5484d}</style></head>
<body>
<h2>Проверка TURN-серверов</h2>
<p>Откройте эту страницу на телефоне через мобильный интернет и нажмите кнопку. Зелёные серверы работают.</p>
<button id="go">Проверить</button><div id="out"></div>
<script>
const S = [
  ['openrelay :80', 'turn:openrelay.metered.ca:80', 'openrelayproject', 'openrelayproject'],
  ['openrelay :443 tcp', 'turn:openrelay.metered.ca:443?transport=tcp', 'openrelayproject', 'openrelayproject'],
  ['openrelay turns :443', 'turns:openrelay.metered.ca:443?transport=tcp', 'openrelayproject', 'openrelayproject'],
  ['freestun :3479', 'turn:freestun.net:3479', 'free', 'free'],
  ['freestun turns :5349', 'turns:freestun.net:5349', 'free', 'free'],
  ['viagenie', 'turn:numb.viagenie.ca', 'webrtc@live.com', 'muazkh']
];
const out = document.getElementById('out');
function test([name, url, username, credential]) {
  const row = document.createElement('div'); row.className = 'r'; row.textContent = name + ': проверяю…'; out.append(row);
  return new Promise(async res => {
    const pc = new RTCPeerConnection({ iceServers: [{ urls: url, username, credential }], iceTransportPolicy: 'relay' });
    let done = false;
    const fin = (ok, why) => { if (done) return; done = true; row.className = 'r ' + (ok ? 'ok' : 'no'); row.textContent = name + (ok ? ': РАБОТАЕТ' : ': не отвечает' + (why ? ' (' + why + ')' : '')); pc.close(); res(); };
    pc.onicecandidate = e => { if (e.candidate && e.candidate.candidate.includes(' typ relay')) fin(true); };
    pc.onicecandidateerror = e => { if (e.errorCode) pc.lastErr = e.errorCode + ' ' + (e.errorText || ''); };
    setTimeout(() => fin(false, pc.lastErr), 9000);
    try { pc.createDataChannel('x'); await pc.setLocalDescription(await pc.createOffer()); } catch (e) { fin(false, e.message); }
  });
}
document.getElementById('go').onclick = async () => { out.innerHTML = ''; await Promise.all(S.map(test)); };
</script></body></html>
