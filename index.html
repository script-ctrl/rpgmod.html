<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Ассасин: диагональ, RPG-стиль</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d0d10; overflow: hidden; font-family: monospace; color: #ccc; }
  #ui { position: absolute; top: 12px; left: 12px; z-index: 2; }
  button { background: #333; color: #eee; border: 1px solid #555; padding: 6px 12px; margin-right: 6px; cursor: pointer; }
  #info { margin-top: 8px; }
</style>
</head>
<body>
<div id="ui">
  <button id="play">Пауза</button>
  <button id="speed">Скорость x1</button>
  <div id="info"></div>
</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const CYCLE = 180;
const TICK_MS = 50;

// Диагональная расстановка: зомби стоят по диагонали, ассасин появляется справа-спереди
const ZOMBIE_POS = [
  new THREE.Vector3(-3.0, 0, -1.8),
  new THREE.Vector3(-1.4, 0, -0.6),
];
const STRIKE_POINT = new THREE.Vector3(0.6, 0, 0.4);
const ENTRY_POINT = new THREE.Vector3(5.0, 0, 3.2);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0d10);
scene.fog = new THREE.Fog(0x0d0d10, 14, 28);

// Камера сверху-справа под углом, как в изометрической RPG
const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.1, 100);
camera.position.set(6.5, 5.5, 9);
camera.lookAt(-0.6, 0.9, -0.2);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xc8ccff, 0x151518, 1.0));
const key = new THREE.DirectionalLight(0xffe2b8, 0.9);
key.position.set(4, 8, 5);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.camera.left = -8;
key.shadow.camera.right = 8;
key.shadow.camera.top = 8;
key.shadow.camera.bottom = -8;
scene.add(key);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.MeshLambertMaterial({ color: 0x1c1c21 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Фигура из кубов с шарнирами
function makeFigure(c) {
  const root = new THREE.Group();
  const mat = col => new THREE.MeshLambertMaterial({ color: col });
  const box = (w, h, d, col) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(col));
    m.castShadow = true;
    return m;
  };

  const hips = new THREE.Group();
  hips.position.y = 0.78;
  root.add(hips);

  const torso = new THREE.Group();
  hips.add(torso);
  const body = box(0.6, 0.75, 0.3, c.body);
  body.position.y = 0.375;
  torso.add(body);

  const head = box(0.5, 0.5, 0.5, c.head);
  head.position.y = 0.95;
  torso.add(head);

  const shoulderL = new THREE.Group();
  shoulderL.position.set(-0.4, 0.7, 0);
  torso.add(shoulderL);
  const armL = box(0.2, 0.7, 0.2, c.arm);
  armL.position.y = -0.35;
  shoulderL.add(armL);

  const shoulderR = new THREE.Group();
  shoulderR.position.set(0.4, 0.7, 0);
  torso.add(shoulderR);
  const armR = box(0.2, 0.7, 0.2, c.arm);
  armR.position.y = -0.35;
  shoulderR.add(armR);

  const hipL = new THREE.Group();
  hipL.position.set(-0.15, 0, 0);
  hips.add(hipL);
  const legL = box(0.22, 0.78, 0.22, c.leg);
  legL.position.y = -0.39;
  hipL.add(legL);

  const hipR = new THREE.Group();
  hipR.position.set(0.15, 0, 0);
  hips.add(hipR);
  const legR = box(0.22, 0.78, 0.22, c.leg);
  legR.position.y = -0.39;
  hipR.add(legR);

  root.userData = { hips, torso, shoulderL, shoulderR, hipL, hipR };
  return root;
}

const assassin = makeFigure({ head: 0x2a1c14, body: 0x2b2b33, arm: 0x2b2b33, leg: 0x1a1a22 });
const blade = new THREE.Mesh(
  new THREE.BoxGeometry(0.06, 0.6, 0.04),
  new THREE.MeshLambertMaterial({ color: 0xd0d4dc })
);
blade.position.set(0, -0.55, 0.12);
assassin.userData.shoulderR.add(blade);
scene.add(assassin);

const zombies = ZOMBIE_POS.map(() => makeFigure({ head: 0x4d7a3a, body: 0x2a7a7a, arm: 0x4d7a3a, leg: 0x2a2a7a }));
zombies.forEach(z => scene.add(z));

// Пыль от скорости и падений
const dust = [];
const dustGeo = new THREE.BoxGeometry(1, 1, 1);
function spawnDust(pos, count, spread) {
  for (let i = 0; i < count; i++) {
    const m = new THREE.Mesh(dustGeo, new THREE.MeshBasicMaterial({ color: 0x8a8a92, transparent: true, opacity: 0.6 }));
    const s = 0.05 + Math.random() * 0.08;
    m.scale.setScalar(s);
    m.position.set(
      pos.x + (Math.random() - 0.5) * spread,
      0.05 + Math.random() * 0.1,
      pos.z + (Math.random() - 0.5) * spread
    );
    m.userData = {
      v: new THREE.Vector3((Math.random() - 0.5) * 0.05, 0.02 + Math.random() * 0.05, (Math.random() - 0.5) * 0.05),
      life: 24 + Math.floor(Math.random() * 14),
      maxLife: 38,
      s
    };
    scene.add(m);
    dust.push(m);
  }
}

const clamp = v => Math.max(0, Math.min(1, v));
const easeOut = k => 1 - Math.pow(1 - k, 3);
const easeIn = k => k * k * k;

function pose(p, { crouch = 0, lean = 0, armBack = 0, armFront = 0, legSwing = 0 } = {}) {
  const u = p.userData;
  u.hips.position.y = 0.78 - 0.4 * crouch;
  u.torso.rotation.x = lean;
  u.hipL.rotation.x = -1.5 * crouch + legSwing;
  u.hipR.rotation.x = -1.5 * crouch - legSwing;
  u.shoulderL.rotation.x = armFront;
  u.shoulderR.rotation.x = armBack;
}

// Зомби падают назад, каждый в свою сторону, с задержкой
const FALL_TICK = [96, 102];
const FALL_DIR = [1, -1];

function applyFrame(t) {
  // Зомби стоят по диагонали, покачиваются, затем падают
  zombies.forEach((z, i) => {
    const base = ZOMBIE_POS[i];
    z.position.copy(base);
    z.rotation.set(0, Math.PI * 0.25, 0);
    z.visible = true;
    const sway = Math.sin(t * 0.2 + i * 2) * 0.04;
    pose(z, { armFront: sway, armBack: -sway });

    if (t >= FALL_TICK[i]) {
      const k = easeOut(clamp((t - FALL_TICK[i]) / 14));
      z.rotation.z = (Math.PI / 2) * k * FALL_DIR[i] * 0.95;
      z.position.y = 0.4 * k;
      if (t === FALL_TICK[i] + 2) spawnDust(base, 8, 0.8);
    }
  });

  // Ассасин: появляется резко (телепорт с первого тика), затем рывок через зомби
  assassin.visible = t < 150;
  assassin.rotation.set(0, 0, 0);
  if (!assassin.visible) return;

  if (t < 2) {
    assassin.position.copy(ENTRY_POINT);
    pose(assassin, { crouch: 0.85, lean: 0.4 });
    return;
  }

  if (t < 30) {
    // Рывок от входной точки к точке удара, низко, с наклоном и взмахом
    const k = clamp((t - 2) / 28);
    const e = easeIn(k);
    assassin.position.lerpVectors(ENTRY_POINT, STRIKE_POINT, e);
    const run = Math.sin(t * 0.9) * 0.5;
    pose(assassin, { crouch: 0.85, lean: 0.4, armBack: 0.8 + run, armFront: -0.6 - run, legSwing: run * 0.8 });
    if (t % 2 === 0) spawnDust(assassin.position, 3, 0.7);
    return;
  }

  if (t < 60) {
    // Торможение у точки удара
    const k = clamp((t - 30) / 30);
    const brake = easeOut(k);
    assassin.position.copy(STRIKE_POINT);
    pose(assassin, { crouch: 0.85 * (1 - brake * 0.3), lean: 0.4 * (1 - brake), armBack: 0.8 * (1 - brake), armFront: -0.6 * (1 - brake) });
    if (t === 35 || t === 45) spawnDust(STRIKE_POINT, 10, 1.2);
    return;
  }

  // Idle в приседе с клинком
  const idle = Math.sin(t * 0.08) * 0.03;
  assassin.position.copy(STRIKE_POINT);
  pose(assassin, { crouch: 0.6, lean: 0.25 + idle, armBack: 0.5, armFront: -0.2 });
}

let tick = 0;
let paused = false;
const speeds = [0.5, 1, 2];
let speedIdx = 1;

document.getElementById('play').onclick = e => {
  paused = !paused;
  e.target.textContent = paused ? 'Играть' : 'Пауза';
};
document.getElementById('speed').onclick = e => {
  speedIdx = (speedIdx + 1) % speeds.length;
  e.target.textContent = `Скорость x${speeds[speedIdx]}`;
};

let last = performance.now();

function loop(now) {
  requestAnimationFrame(loop);
  const dt = now - last;
  last = now;
  if (!paused) {
    tick += (dt / TICK_MS) * speeds[speedIdx];
    if (tick >= CYCLE) {
      tick -= CYCLE;
      dust.forEach(d => scene.remove(d));
      dust.length = 0;
    }
  }

  applyFrame(tick);

  for (let i = dust.length - 1; i >= 0; i--) {
    const d = dust[i];
    d.userData.life--;
    d.position.add(d.userData.v);
    d.userData.v.y -= 0.003;
    d.userData.v.multiplyScalar(0.96);
    const k = Math.max(0, d.userData.life / d.userData.maxLife);
    d.scale.setScalar(d.userData.s * (0.4 + 0.6 * k));
    d.material.opacity = 0.6 * k;
    if (d.userData.life <= 0) {
      scene.remove(d);
      d.material.dispose();
      dust.splice(i, 1);
    }
  }

  document.getElementById('info').textContent = `тик: ${Math.floor(tick)} / ${CYCLE}`;
  renderer.render(scene, camera);
}
requestAnimationFrame(loop);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
