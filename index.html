<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Ассасин: таймлайн 3.0 с</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d0d10; overflow: hidden; font-family: monospace; color: #ccc; }
  #ui { position: absolute; top: 12px; left: 12px; z-index: 2; }
  button { background: #333; color: #eee; border: 1px solid #555; padding: 6px 12px; margin-right: 6px; cursor: pointer; }
  #info { margin-top: 8px; }
</style>
</head>
<body>
<div id="ui">
  <button id="play">Пауза</button>
  <button id="speed">Скорость x1</button>
  <div id="info"></div>
</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const LEAD_IN = 0.6;          // сек: только зомби, до появления ассасина
const DURATION = 3.0;         // сек: таймлайн ассасина из ТЗ
const CYCLE = LEAD_IN + DURATION;

const ZOMBIE_POS = [new THREE.Vector3(-2.4, 0, -1.6), new THREE.Vector3(-1.0, 0, -0.4)];
const ASSASSIN_POS = new THREE.Vector3(0.4, 0, 0.2);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0d10);
scene.fog = new THREE.Fog(0x0d0d10, 14, 28);

const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.1, 100);
camera.position.set(6.5, 5.0, 8.5);
camera.lookAt(-0.6, 1.0, -0.2);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xc8ccff, 0x151518, 1.0));
const key = new THREE.DirectionalLight(0xffe2b8, 0.9);
key.position.set(4, 8, 5);
scene.add(key);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshLambertMaterial({ color: 0x1c1c21 }));
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

// Фигура из кубов. Все материалы прозрачные, чтобы можно было растворять силуэт.
function makeFigure(c) {
  const root = new THREE.Group();
  const mats = [];
  const mat = (col, opts = {}) => {
    const m = new THREE.MeshLambertMaterial({ color: col, transparent: true, opacity: 1, ...opts });
    mats.push(m);
    return m;
  };
  const box = (w, h, d, col) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(col));
    return m;
  };

  const hips = new THREE.Group();
  hips.position.y = 0.78;
  root.add(hips);

  const torso = new THREE.Group();
  hips.add(torso);
  const body = box(0.6, 0.75, 0.3, c.body);
  body.position.y = 0.375;
  torso.add(body);

  // Голова: группа для поворота, капюшон как дочерний элемент
  const head = new THREE.Group();
  head.position.y = 0.95;
  torso.add(head);
  const skull = box(0.5, 0.5, 0.5, c.head);
  head.add(skull);

  const hood = box(0.56, 0.3, 0.56, c.hood || c.body);
  hood.position.y = 0.2;
  head.add(hood);

  const shoulderL = new THREE.Group();
  shoulderL.position.set(-0.4, 0.7, 0);
  torso.add(shoulderL);
  const armL = box(0.2, 0.7, 0.2, c.arm);
  armL.position.y = -0.35;
  shoulderL.add(armL);

  const shoulderR = new THREE.Group();
  shoulderR.position.set(0.4, 0.7, 0);
  torso.add(shoulderR);
  const armR = box(0.2, 0.7, 0.2, c.arm);
  armR.position.y = -0.35;
  shoulderR.add(armR);

  const hipL = new THREE.Group();
  hipL.position.set(-0.15, 0, 0);
  hips.add(hipL);
  const legL = box(0.22, 0.78, 0.22, c.leg);
  legL.position.y = -0.39;
  hipL.add(legL);

  const hipR = new THREE.Group();
  hipR.position.set(0.15, 0, 0);
  hips.add(hipR);
  const legR = box(0.22, 0.78, 0.22, c.leg);
  legR.position.y = -0.39;
  hipR.add(legR);

  root.userData = { hips, torso, head, hood, shoulderL, shoulderR, hipL, hipR, mats };
  return root;
}

const assassin = makeFigure({ head: 0x2a1c14, body: 0x2b2b33, hood: 0x1a1a22, arm: 0x2b2b33, leg: 0x1a1a22 });
assassin.position.copy(ASSASSIN_POS);
scene.add(assassin);

// Клинок: в руке, но в позе покоя спрятан за спиной
const blade = new THREE.Mesh(
  new THREE.BoxGeometry(0.06, 0.7, 0.04),
  new THREE.MeshLambertMaterial({ color: 0xd0d4dc, emissive: 0x88ccff, emissiveIntensity: 0, transparent: true })
);
assassin.userData.shoulderR.add(blade);
const BLADE_BACK = { p: new THREE.Vector3(0.12, 0.25, -0.3), r: new THREE.Euler(0.6, 0, -0.5) };
const BLADE_HAND = { p: new THREE.Vector3(0, -0.6, 0.12), r: new THREE.Euler(0, 0, 0) };

const zombies = ZOMBIE_POS.map(() => makeFigure({ head: 0x4d7a3a, body: 0x2a7a7a, arm: 0x4d7a3a, leg: 0x2a2a7a }));
zombies.forEach((z, i) => {
  z.position.copy(ZOMBIE_POS[i]);
  z.rotation.y = Math.PI * 0.25;
  scene.add(z);
});

// Пыль
const dust = [];
const dustGeo = new THREE.BoxGeometry(1, 1, 1);
function spawnDust(pos, count, spread) {
  for (let i = 0; i < count; i++) {
    const m = new THREE.Mesh(dustGeo, new THREE.MeshBasicMaterial({ color: 0x8a8a92, transparent: true, opacity: 0.6 }));
    const s = 0.05 + Math.random() * 0.08;
    m.scale.setScalar(s);
    m.position.set(pos.x + (Math.random() - 0.5) * spread, 0.05 + Math.random() * 0.1, pos.z + (Math.random() - 0.5) * spread);
    m.userData = {
      v: new THREE.Vector3((Math.random() - 0.5) * 0.05, 0.02 + Math.random() * 0.05, (Math.random() - 0.5) * 0.05),
      life: 24 + Math.floor(Math.random() * 14), maxLife: 38, s
    };
    scene.add(m);
    dust.push(m);
  }
}

const clamp = v => Math.max(0, Math.min(1, v));
const easeOut = k => 1 - Math.pow(1 - k, 3);
const easeInOut = k => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
const lerp = (a, b, k) => a + (b - a) * k;

function setPose(p, { crouch = 0, lean = 0, armR = 0, armL = 0 } = {}) {
  const u = p.userData;
  u.hips.position.y = 0.78 - 0.4 * crouch;
  u.torso.rotation.x = lean;
  u.hipL.rotation.x = -1.5 * crouch;
  u.hipR.rotation.x = -1.5 * crouch;
  u.shoulderL.rotation.x = armL;
  u.shoulderR.rotation.x = armR;
}

function setOpacity(p, o) {
  p.userData.mats.forEach(m => { m.opacity = o; });
}

// Зомби стоят, покачиваются; умирают на 1.7 с ассасина
const ZOMBIE_DEATH = 1.7;
function applyZombies(t, a) {
  zombies.forEach((z, i) => {
    const sway = Math.sin(t * 2 + i * 2) * 0.04;
    setPose(z, { armR: sway, armL: -sway });
    z.position.copy(ZOMBIE_POS[i]);
    z.position.y = 0;
    z.rotation.set(0, Math.PI * 0.25, 0);
    if (a >= ZOMBIE_DEATH) {
      const k = easeOut(clamp((a - ZOMBIE_DEATH) / 0.4));
      z.rotation.z = (Math.PI / 2) * k * (i === 0 ? 1 : -1) * 0.95;
      z.position.y = 0.4 * k;
    }
  });
}

// Ассасин по таймлайну из ТЗ. a = секунды от появления.
function applyAssassin(a) {
  if (a < 0) { assassin.visible = false; return; }
  assassin.visible = true;
  assassin.position.copy(ASSASSIN_POS);
  assassin.rotation.set(0, 0, 0);
  const u = assassin.userData;

  // 0.0–0.8: поворот головы к зрителю, капюшон на голове
  if (a < 0.8) {
    u.head.rotation.y = lerp(Math.PI * 0.6, 0, easeOut(clamp(a / 0.8)));
    setPose(assassin, { crouch: 0.5, lean: 0.2 });
    u.hood.position.y = 0.2;
    blade.position.copy(BLADE_BACK.p);
    blade.rotation.copy(BLADE_BACK.r);
    blade.material.emissiveIntensity = 0;
    setOpacity(assassin, 1);
    return;
  }

  // 0.8–1.4: клинок выходит из-за спины в руку
  if (a < 1.4) {
    u.head.rotation.y = 0;
    const k = easeInOut(clamp((a - 0.8) / 0.6));
    blade.position.lerpVectors(BLADE_BACK.p, BLADE_HAND.p, k);
    blade.rotation.set(lerp(BLADE_BACK.r.x, 0, k), 0, lerp(BLADE_BACK.r.z, 0, k));
    setPose(assassin, { crouch: 0.5, lean: 0.2, armR: lerp(-0.2, 0.2, k) });
    return;
  }

  // 1.4–2.0: быстрый росчерк у плеча, вспышка лезвия пиком на 1.7 с
  if (a < 2.0) {
    const k = easeInOut(clamp((a - 1.4) / 0.6));
    setPose(assassin, { crouch: 0.5, lean: 0.2, armR: lerp(0.2, 1.1, k) });
    blade.position.copy(BLADE_HAND.p);
    blade.rotation.set(0, 0, 0);
    const flash = Math.max(0, 1 - Math.abs(a - 1.7) / 0.18);
    blade.material.emissiveIntensity = flash * 1.5;
    return;
  }

  // 2.0–2.6: капюшон опускается, силуэт растворяется в тени
  if (a < 2.6) {
    const k = easeInOut(clamp((a - 2.0) / 0.6));
    setPose(assassin, { crouch: 0.5, lean: 0.2, armR: lerp(1.1, 0.2, k) });
    u.hood.position.y = lerp(0.2, -0.05, k);
    blade.material.emissiveIntensity = 0;
    const bump = Math.sin(k * Math.PI);
    setOpacity(assassin, 1 - 0.7 * bump);
    return;
  }

  // 2.6–3.0: возврат в исходную позу, клинок прячется
  const k = easeInOut(clamp((a - 2.6) / 0.4));
  u.hood.position.y = lerp(-0.05, 0.2, k);
  u.head.rotation.y = 0;
  setPose(assassin, { crouch: 0.5, lean: 0.2, armR: lerp(0.2, 0, k) });
  blade.position.lerpVectors(BLADE_HAND.p, BLADE_BACK.p, k);
  blade.rotation.set(lerp(0, BLADE_BACK.r.x, k), 0, lerp(0, BLADE_BACK.r.z, k));
  setOpacity(assassin, 1);
}

let tick = 0;          // секунды внутри цикла
let paused = false;
const speeds = [0.5, 1, 2];
let speedIdx = 1;
let prevA = -Infinity;

document.getElementById('play').onclick = e => {
  paused = !paused;
  e.target.textContent = paused ? 'Играть' : 'Пауза';
};
document.getElementById('speed').onclick = e => {
  speedIdx = (speedIdx + 1) % speeds.length;
  e.target.textContent = `Скорость x${speeds[speedIdx]}`;
};

let last = performance.now();

function loop(now) {
  requestAnimationFrame(loop);
  const dt = (now - last) / 1000;
  last = now;
  if (!paused) {
    tick += dt * speeds[speedIdx];
    if (tick >= CYCLE) {
      tick -= CYCLE;
      prevA = -Infinity;
      dust.forEach(d => scene.remove(d));
      dust.length = 0;
    }
  }

  const a = tick - LEAD_IN;
  applyZombies(tick, a);
  applyAssassin(a);

  // Пыль в момент появления, на рывке-росчерке и при падении зомби
  if (prevA < 0 && a >= 0) spawnDust(ASSASSIN_POS, 8, 1.0);
  if (prevA < 1.4 && a >= 1.4) spawnDust(ASSASSIN_POS, 4, 0.6);
  if (prevA < ZOMBIE_DEATH && a >= ZOMBIE_DEATH) {
    zombies.forEach((z, i) => spawnDust(ZOMBIE_POS[i], 8, 0.8));
  }
  prevA = a;

  for (let i = dust.length - 1; i >= 0; i--) {
    const d = dust[i];
    d.userData.life--;
    d.position.add(d.userData.v);
    d.userData.v.y -= 0.003;
    d.userData.v.multiplyScalar(0.96);
    const k = Math.max(0, d.userData.life / d.userData.maxLife);
    d.scale.setScalar(d.userData.s * (0.4 + 0.6 * k));
    d.material.opacity = 0.6 * k;
    if (d.userData.life <= 0) {
      scene.remove(d);
      d.material.dispose();
      dust.splice(i, 1);
    }
  }

  document.getElementById('info').textContent = `t = ${tick.toFixed(2)} с   ассасин: ${Math.max(0, a).toFixed(2)} с`;
  renderer.render(scene, camera);
}
requestAnimationFrame(loop);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
