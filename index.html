<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Ассасин: новая анимация</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; font-family: monospace; color: #ccc; }
  #ui { position: absolute; top: 12px; left: 12px; z-index: 2; }
  button { background: #333; color: #eee; border: 1px solid #555; padding: 6px 12px; margin-right: 6px; cursor: pointer; }
  #info { margin-top: 8px; }
</style>
</head>
<body>
<div id="ui">
  <button id="play">Пауза</button>
  <button id="speed">Скорость x1</button>
  <div id="info"></div>
</div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const CYCLE = 180;        // тиков в цикле
const TICK_MS = 50;
const ENTRY_X = 10;       // за правым краем кадра
const STOP_X = 2.2;       // где ассасин тормозит
const ZOMBIE_X = [-3.2, -1.6];

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x141418);
scene.fog = new THREE.Fog(0x141418, 16, 30);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 2.4, 11);
camera.lookAt(0, 1.1, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xdde0ff, 0x1a1a1e, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 0.6);
sun.position.set(-4, 8, 6);
scene.add(sun);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(80, 80),
  new THREE.MeshLambertMaterial({ color: 0x1f1f24 })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

// Фигура из кубов. Таз в точке hips, ноги и руки висят на шарнирах.
function makeFigure(c) {
  const root = new THREE.Group();
  const mat = col => new THREE.MeshLambertMaterial({ color: col });
  const box = (w, h, d, col) => new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(col));

  const hips = new THREE.Group();
  hips.position.y = 0.78;
  root.add(hips);

  const torso = new THREE.Group();
  hips.add(torso);
  const body = box(0.6, 0.75, 0.3, c.body);
  body.position.y = 0.375;
  torso.add(body);

  const head = box(0.5, 0.5, 0.5, c.head);
  head.position.y = 0.95;
  torso.add(head);

  const shoulderL = new THREE.Group();
  shoulderL.position.set(-0.4, 0.7, 0);
  torso.add(shoulderL);
  const armL = box(0.2, 0.7, 0.2, c.arm);
  armL.position.y = -0.35;
  shoulderL.add(armL);

  const shoulderR = new THREE.Group();
  shoulderR.position.set(0.4, 0.7, 0);
  torso.add(shoulderR);
  const armR = box(0.2, 0.7, 0.2, c.arm);
  armR.position.y = -0.35;
  shoulderR.add(armR);

  const hipL = new THREE.Group();
  hipL.position.set(-0.15, 0, 0);
  hips.add(hipL);
  const legL = box(0.22, 0.78, 0.22, c.leg);
  legL.position.y = -0.39;
  hipL.add(legL);

  const hipR = new THREE.Group();
  hipR.position.set(0.15, 0, 0);
  hips.add(hipR);
  const legR = box(0.22, 0.78, 0.22, c.leg);
  legR.position.y = -0.39;
  hipR.add(legR);

  root.userData = { hips, torso, shoulderL, shoulderR, hipL, hipR };
  return root;
}

const assassin = makeFigure({ head: 0x2a1c14, body: 0x2b2b33, arm: 0x2b2b33, leg: 0x1a1a22 });
const zombies = [
  makeFigure({ head: 0x4d7a3a, body: 0x2a7a7a, arm: 0x4d7a3a, leg: 0x2a2a7a }),
  makeFigure({ head: 0x4d7a3a, body: 0x2a7a7a, arm: 0x4d7a3a, leg: 0x2a2a7a }),
];
// Клинок в правой руке ассасина
const blade = new THREE.Mesh(
  new THREE.BoxGeometry(0.06, 0.6, 0.04),
  new THREE.MeshLambertMaterial({ color: 0xc8ccd4 })
);
blade.position.set(0, -0.55, 0.12);
assassin.userData.shoulderR.add(blade);
scene.add(assassin, ...zombies);

// Пыль
const dust = [];
const dustGeo = new THREE.BoxGeometry(1, 1, 1);
function spawnDust(x, count, spread) {
  for (let i = 0; i < count; i++) {
    const m = new THREE.Mesh(dustGeo, new THREE.MeshBasicMaterial({ color: 0x77777f, transparent: true, opacity: 0.6 }));
    const s = 0.05 + Math.random() * 0.07;
    m.scale.setScalar(s);
    m.position.set(x + (Math.random() - 0.5) * spread, 0.05 + Math.random() * 0.1, (Math.random() - 0.5) * 0.4);
    m.userData = {
      v: new THREE.Vector3((Math.random() - 0.5) * 0.04, 0.02 + Math.random() * 0.04, (Math.random() - 0.5) * 0.04),
      life: 22 + Math.floor(Math.random() * 12),
      maxLife: 34,
      s
    };
    scene.add(m);
    dust.push(m);
  }
}

const clamp = v => Math.max(0, Math.min(1, v));
const easeOut = k => 1 - Math.pow(1 - k, 3);
const easeIn = k => k * k * k;

function pose(p, { crouch = 0, lean = 0, armBack = 0, armFront = 0, legSwing = 0 } = {}) {
  const u = p.userData;
  u.hips.position.y = 0.78 - 0.4 * crouch;
  u.torso.rotation.x = lean;
  u.hipL.rotation.x = -1.5 * crouch + legSwing;
  u.hipR.rotation.x = -1.5 * crouch - legSwing;
  u.shoulderL.rotation.x = armFront;
  u.shoulderR.rotation.x = armBack;
}

function applyFrame(t) {
  // Зомби стоят, затем падают назад, когда ассасин проносится мимо
  zombies.forEach((z, i) => {
    z.position.set(ZOMBIE_X[i], 0, 0);
    z.rotation.set(0, 0, 0);
    z.visible = t < 170;
    const sway = Math.sin(t * 0.2 + i * 2) * 0.04;
    pose(z, { armFront: sway, armBack: -sway });
    if (t >= 95) {
      const k = easeOut(clamp((t - 95) / 14));
      z.rotation.z = (Math.PI / 2) * k * (i === 0 ? 1 : -1) * 0.95;
      z.position.y = 0.4 * k;
    }
  });

  // Ассасин
  assassin.visible = t >= 0 && t < 150;
  assassin.rotation.set(0, 0, 0);
  if (!assassin.visible) return;

  if (t < 30) {
    // Вбегает справа в полном рывке, низко, с наклоном
    const k = clamp(t / 30);
    assassin.position.set(ENTRY_X + (STOP_X - ENTRY_X) * easeOut(k) * 0 + (STOP_X - ENTRY_X) * k, 0, 0);
    const run = Math.sin(t * 0.9) * 0.5;
    pose(assassin, { crouch: 0.85, lean: 0.4, armBack: 0.8 + run, armFront: -0.6 - run, legSwing: run * 0.8 });
    if (t % 3 < 1) spawnDust(assassin.position.x - 0.4, 3, 0.8);
    return;
  }

  if (t < 60) {
    // Торможение: ноги упираются, пыль из-под стоп
    const k = clamp((t - 30) / 30);
    const brake = easeOut(k);
    assassin.position.x = STOP_X + (1 - brake) * 0.3;
    pose(assassin, { crouch: 0.85 * (1 - brake * 0.3), lean: 0.4 * (1 - brake), armBack: 0.8 * (1 - brake), armFront: -0.6 * (1 - brake) });
    if (t === 35 || t === 45) spawnDust(assassin.position.x, 10, 1.2);
    return;
  }

  // Приседание, перевод в idle: клинок в руке, корпус вперёд
  const idle = Math.sin(t * 0.08) * 0.03;
  assassin.position.x = STOP_X;
  pose(assassin, { crouch: 0.6, lean: 0.25 + idle, armBack: 0.5, armFront: -0.2 });
}

let tick = 0;
let paused = false;
const speeds = [0.5, 1, 2];
let speedIdx = 1;

document.getElementById('play').onclick = e => {
  paused = !paused;
  e.target.textContent = paused ? 'Играть' : 'Пауза';
};
document.getElementById('speed').onclick = e => {
  speedIdx = (speedIdx + 1) % speeds.length;
  e.target.textContent = `Скорость x${speeds[speedIdx]}`;
};

let last = performance.now();

function loop(now) {
  requestAnimationFrame(loop);
  const dt = now - last;
  last = now;
  if (!paused) {
    tick += (dt / TICK_MS) * speeds[speedIdx];
    if (tick >= CYCLE) {
      tick -= CYCLE;
      dust.forEach(d => scene.remove(d));
      dust.length = 0;
    }
  }

  applyFrame(tick);

  for (let i = dust.length - 1; i >= 0; i--) {
    const d = dust[i];
    d.userData.life--;
    d.position.add(d.userData.v);
    d.userData.v.y -= 0.003;
    d.userData.v.multiplyScalar(0.96);
    const k = Math.max(0, d.userData.life / d.userData.maxLife);
    d.scale.setScalar(d.userData.s * (0.4 + 0.6 * k));
    d.material.opacity = 0.6 * k;
    if (d.userData.life <= 0) {
      scene.remove(d);
      d.material.dispose();
      dust.splice(i, 1);
    }
  }

  document.getElementById('info').textContent = `тик: ${Math.floor(tick)} / ${CYCLE}`;
  renderer.render(scene, camera);
}
requestAnimationFrame(loop);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
